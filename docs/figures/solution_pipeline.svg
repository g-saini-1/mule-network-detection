<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 942 560" role="img" aria-label="The mule detection system's pipeline: AMLworld HI-Small files pass through data ingestion and validation and data preparation, then to the rules engine, the feature pipeline and the ML model, whose scores go to the evaluation harness. Each component reads from and writes to the raw, interim and processed data zones. Tuning uses the validation period only, and the test period is scored once.">
  <style>
    svg { --bg: #ffffff; --fg: #1b2230; --muted: #5a6475; --line: #c4cad5; --accent: #0d6b62; --accent-soft: #e3f1ef; --tag: #e9ecf2; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #1a202a; --fg: #e4e8ef; --muted: #9aa4b5; --line: #3a4352; --accent: #5cc8b8; --accent-soft: #173a36; --tag: #273041; }
    }
    .bg { fill: var(--bg); }
    text { font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; }
    .grp { fill: none; stroke: var(--line); stroke-width: 1; }
    .grp-t { font-size: 13px; font-weight: 600; fill: var(--muted); letter-spacing: 0.06em; }
    .box { fill: var(--bg); stroke: var(--fg); stroke-width: 1.3; }
    .box.has { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
    .box.none { fill: none; stroke: var(--muted); stroke-dasharray: 5 4; }
    .t { font-size: 13px; font-weight: 600; fill: var(--fg); }
    .none-t { fill: var(--muted); }
    .s { font-size: 11px; fill: var(--muted); }
    .pill { fill: var(--tag); }
    .pill-t { font-family: "IBM Plex Mono", Menlo, monospace; font-size: 10px; font-weight: 500; fill: var(--fg); }
    .flow { stroke: var(--fg); stroke-width: 1.4; fill: none; }
    .rw { stroke: var(--muted); stroke-width: 1.2; fill: none; stroke-dasharray: 3 3; }
    .flow-l { font-size: 11px; font-weight: 500; fill: var(--muted); }
    .loop { stroke: var(--accent); stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; }
    .loop-l { font-size: 11px; font-weight: 500; fill: var(--accent); }
    .ah { fill: var(--fg); }
    .ah-acc { fill: var(--accent); }
    .ah-mut { fill: var(--muted); }
    .leg { font-size: 12px; fill: var(--muted); }
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-acc" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-mut" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="942" height="560"/>

  <!-- Tuning loop -->
  <path class="loop" d="M831 60 V40 H591 V58" marker-end="url(#a2)"/>
  <text class="loop-l" x="711" y="32" text-anchor="middle">tuning on validation only; test period scored once</text>

  <!-- Group frames -->
  <rect class="grp" x="16" y="60" width="190" height="270" rx="6"/>
  <rect class="grp" x="256" y="60" width="190" height="270" rx="6"/>
  <rect class="grp" x="496" y="60" width="190" height="270" rx="6"/>
  <rect class="grp" x="736" y="60" width="190" height="270" rx="6"/>
  <text class="grp-t" x="111" y="86" text-anchor="middle">SOURCE</text>
  <text class="grp-t" x="351" y="86" text-anchor="middle">INGEST, PREPARE</text>
  <text class="grp-t" x="591" y="86" text-anchor="middle">DETECTION</text>
  <text class="grp-t" x="831" y="86" text-anchor="middle">EVALUATION</text>

  <!-- Source -->
  <rect class="box has" x="31" y="104" width="160" height="62" rx="4"/>
  <text class="t" x="111" y="130" text-anchor="middle">AMLworld HI-Small</text>
  <text class="s" x="111" y="148" text-anchor="middle">Kaggle, synthetic</text>
  <rect class="box none" x="31" y="180" width="160" height="62" rx="4"/>
  <text class="t none-t" x="111" y="206" text-anchor="middle">Bank-only data</text>
  <text class="s" x="111" y="224" text-anchor="middle">KYC, devices, reports</text>

  <!-- Ingest and prepare -->
  <rect class="box has" x="271" y="104" width="160" height="62" rx="4"/>
  <text class="t" x="351" y="129" text-anchor="middle">Data ingestion</text>
  <text class="t" x="351" y="146" text-anchor="middle">and validation</text>
  <rect class="pill" x="389" y="96" width="28" height="16" rx="3"/><text class="pill-t" x="403" y="108" text-anchor="middle">S1</text>
  <rect class="box has" x="271" y="180" width="160" height="62" rx="4"/>
  <text class="t" x="351" y="206" text-anchor="middle">Data preparation</text>
  <text class="s" x="351" y="224" text-anchor="middle">labels, prepared data</text>
  <rect class="pill" x="357" y="172" width="28" height="16" rx="3"/><text class="pill-t" x="371" y="184" text-anchor="middle">S1</text>
  <rect class="pill" x="389" y="172" width="28" height="16" rx="3"/><text class="pill-t" x="403" y="184" text-anchor="middle">S2</text>
  <line class="flow" x1="351" y1="166" x2="351" y2="178" marker-end="url(#a1)"/>

  <!-- Detection -->
  <rect class="box" x="511" y="104" width="160" height="62" rx="4"/>
  <text class="t" x="591" y="130" text-anchor="middle">Rules engine</text>
  <text class="s" x="591" y="148" text-anchor="middle">explainable account rules</text>
  <rect class="pill" x="629" y="96" width="28" height="16" rx="3"/><text class="pill-t" x="643" y="108" text-anchor="middle">S2</text>
  <rect class="box" x="511" y="180" width="160" height="62" rx="4"/>
  <text class="t" x="591" y="206" text-anchor="middle">Feature pipeline</text>
  <text class="s" x="591" y="224" text-anchor="middle">account, velocity, graph</text>
  <rect class="pill" x="597" y="172" width="28" height="16" rx="3"/><text class="pill-t" x="611" y="184" text-anchor="middle">S3</text>
  <rect class="pill" x="629" y="172" width="28" height="16" rx="3"/><text class="pill-t" x="643" y="184" text-anchor="middle">S4</text>
  <rect class="box" x="511" y="256" width="160" height="62" rx="4"/>
  <text class="t" x="591" y="282" text-anchor="middle">ML model</text>
  <text class="s" x="591" y="300" text-anchor="middle">account risk score</text>
  <rect class="pill" x="629" y="248" width="28" height="16" rx="3"/><text class="pill-t" x="643" y="260" text-anchor="middle">S3</text>
  <line class="flow" x1="591" y1="242" x2="591" y2="254" marker-end="url(#a1)"/>

  <!-- Evaluation -->
  <rect class="box" x="751" y="104" width="160" height="214" rx="4"/>
  <text class="t" x="831" y="134" text-anchor="middle">Evaluation harness</text>
  <text class="s" x="831" y="170" text-anchor="middle">temporal split</text>
  <text class="s" x="831" y="190" text-anchor="middle">alert budget metrics</text>
  <text class="s" x="831" y="210" text-anchor="middle">cost and thresholds</text>
  <text class="s" x="831" y="230" text-anchor="middle">stability and errors</text>
  <rect class="pill" x="805" y="96" width="28" height="16" rx="3"/><text class="pill-t" x="819" y="108" text-anchor="middle">S2</text>
  <rect class="pill" x="837" y="96" width="28" height="16" rx="3"/><text class="pill-t" x="851" y="108" text-anchor="middle">S3</text>
  <rect class="pill" x="869" y="96" width="28" height="16" rx="3"/><text class="pill-t" x="883" y="108" text-anchor="middle">S5</text>

  <!-- Flows between groups -->
  <line class="flow" x1="206" y1="135" x2="254" y2="135" marker-end="url(#a1)"/>
  <text class="flow-l" x="231" y="126" text-anchor="middle">files</text>
  <line class="flow" x1="446" y1="195" x2="494" y2="195" marker-end="url(#a1)"/>
  <text class="flow-l" x="471" y="186" text-anchor="middle">data</text>
  <line class="flow" x1="686" y1="195" x2="734" y2="195" marker-end="url(#a1)"/>
  <text class="flow-l" x="711" y="186" text-anchor="middle">scores</text>

  <!-- Data stores band -->
  <rect class="grp" x="256" y="380" width="670" height="110" rx="6"/>
  <text class="grp-t" x="591" y="404" text-anchor="middle">DATA STORES</text>
  <rect class="box has" x="271" y="418" width="160" height="56" rx="4"/>
  <text class="t" x="351" y="442" text-anchor="middle">Raw zone</text>
  <text class="s" x="351" y="460" text-anchor="middle">as downloaded</text>
  <rect class="pill" x="389" y="410" width="28" height="16" rx="3"/><text class="pill-t" x="403" y="422" text-anchor="middle">S1</text>
  <rect class="box" x="511" y="418" width="160" height="56" rx="4"/>
  <text class="t" x="591" y="442" text-anchor="middle">Interim zone</text>
  <text class="s" x="591" y="460" text-anchor="middle">prepared transactions</text>
  <rect class="pill" x="629" y="410" width="28" height="16" rx="3"/><text class="pill-t" x="643" y="422" text-anchor="middle">S2</text>
  <rect class="box has" x="751" y="418" width="160" height="56" rx="4"/>
  <text class="t" x="831" y="442" text-anchor="middle">Processed zone</text>
  <text class="s" x="831" y="460" text-anchor="middle">labels, split, scores</text>
  <rect class="pill" x="837" y="410" width="28" height="16" rx="3"/><text class="pill-t" x="851" y="422" text-anchor="middle">S1</text>
  <rect class="pill" x="869" y="410" width="28" height="16" rx="3"/><text class="pill-t" x="883" y="422" text-anchor="middle">S2</text>

  <!-- Read and write links -->
  <line class="rw" x1="351" y1="330" x2="351" y2="378" marker-start="url(#a3)" marker-end="url(#a3)"/>
  <line class="rw" x1="591" y1="330" x2="591" y2="378" marker-start="url(#a3)" marker-end="url(#a3)"/>
  <line class="rw" x1="831" y1="330" x2="831" y2="378" marker-start="url(#a3)" marker-end="url(#a3)"/>
  <text class="flow-l" x="600" y="358">reads and writes</text>

  <!-- Legend -->
  <rect class="box has" x="16" y="522" width="26" height="14" rx="3"/>
  <text class="leg" x="50" y="533">Built so far</text>
  <rect class="box" x="170" y="522" width="26" height="14" rx="3"/>
  <text class="leg" x="204" y="533">Planned</text>
  <rect class="box none" x="300" y="522" width="26" height="14" rx="3"/>
  <text class="leg" x="334" y="533">Outside the project</text>
  <rect class="pill" x="490" y="521" width="28" height="16" rx="3"/><text class="pill-t" x="504" y="533" text-anchor="middle">S2</text>
  <text class="leg" x="526" y="533">Project stage that builds it</text>
</svg>
