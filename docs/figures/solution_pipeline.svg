<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1002 440" role="img" aria-label="Context map of the mule detection system. AMLworld HI-Small files enter the source data context, where data ingestion and validation feed transaction preparation, which uses the payment rules of the payments context: transfer type flags and base currency amounts. Prepared transactions go to the detection context: the rules engine, the feature pipeline and the ML model. Source data also passes typed transactions and the patterns file to the ground truth and evaluation context, where ground truth, the account and transaction labels, feeds the evaluation harness. Detection's scores go to the evaluation harness. The evaluation context sends scoring times to detection, tunes on the validation period only and scores the test period once. No flow goes from ground truth to detection. Bank-only data sits outside the project.">
  <style>
    svg { --bg: #ffffff; --fg: #1b2230; --muted: #5a6475; --line: #c4cad5; --accent: #0d6b62; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #1a202a; --fg: #e4e8ef; --muted: #9aa4b5; --line: #3a4352; --accent: #5cc8b8; }
    }
    .bg { fill: var(--bg); }
    text { font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; }
    .grp { fill: none; stroke: var(--line); stroke-width: 1; }
    .grp-t { font-size: 13px; font-weight: 600; fill: var(--muted); letter-spacing: 0.06em; }
    .box { fill: var(--bg); stroke: var(--fg); stroke-width: 1.3; }
    .box.none { fill: none; stroke: var(--muted); stroke-dasharray: 5 4; }
    .t { font-size: 13px; font-weight: 600; fill: var(--fg); }
    .none-t { fill: var(--muted); }
    .s { font-size: 11px; fill: var(--muted); }
    .flow { stroke: var(--fg); stroke-width: 1.4; fill: none; }
    .flow-l { font-size: 11px; font-weight: 500; fill: var(--muted); }
    .loop { stroke: var(--accent); stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; }
    .loop-l { font-size: 11px; font-weight: 500; fill: var(--accent); }
    .ah { fill: var(--fg); }
    .ah-acc { fill: var(--accent); }
    .leg { font-size: 12px; fill: var(--muted); }
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-acc" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1002" height="440"/>

  <g transform="translate(0 30)">
  <!-- Typed transactions and patterns, from source data to ground truth -->
  <path class="flow" d="M300 60 V10 H966 V118" marker-end="url(#a1)"/>
  <text class="flow-l" x="630" y="4" text-anchor="middle">typed transactions, patterns file</text>

  <!-- Scoring times and tuning, from evaluation to detection -->
  <path class="loop" d="M898.5 60 V40 H693.5 V58" marker-end="url(#a2)"/>
  <text class="loop-l" x="796" y="32" text-anchor="middle">scoring times; tuning on validation only; test scored once</text>

  <!-- Context frames -->
  <rect class="grp" x="16" y="60" width="150" height="292" rx="6"/>
  <rect class="grp" x="196" y="60" width="175" height="292" rx="6"/>
  <rect class="grp" x="401" y="60" width="175" height="292" rx="6"/>
  <rect class="grp" x="606" y="60" width="175" height="292" rx="6"/>
  <rect class="grp" x="811" y="60" width="175" height="292" rx="6"/>
  <text class="grp-t" x="91" y="86" text-anchor="middle">EXTERNAL</text>
  <text class="grp-t" x="283.5" y="86" text-anchor="middle">SOURCE DATA</text>
  <text class="grp-t" x="488.5" y="86" text-anchor="middle">PAYMENTS</text>
  <text class="grp-t" x="693.5" y="86" text-anchor="middle">DETECTION</text>
  <text class="grp-t" x="898.5" y="82" text-anchor="middle">GROUND TRUTH</text>
  <text class="grp-t" x="898.5" y="98" text-anchor="middle">AND EVALUATION</text>

  <!-- External -->
  <rect class="box" x="21" y="120" width="140" height="62" rx="4"/>
  <text class="t" x="91" y="146" text-anchor="middle">AMLworld HI-Small</text>
  <text class="s" x="91" y="164" text-anchor="middle">Kaggle, synthetic</text>
  <rect class="box none" x="21" y="196" width="140" height="62" rx="4"/>
  <text class="t none-t" x="91" y="222" text-anchor="middle">Bank-only data</text>
  <text class="s" x="91" y="240" text-anchor="middle">KYC, devices, reports</text>

  <!-- Source data -->
  <rect class="box" x="208" y="120" width="151" height="62" rx="4"/>
  <text class="t" x="283.5" y="145" text-anchor="middle">Data ingestion</text>
  <text class="t" x="283.5" y="162" text-anchor="middle">and validation</text>
  <rect class="box" x="208" y="196" width="151" height="62" rx="4"/>
  <text class="t" x="283.5" y="221" text-anchor="middle">Transaction</text>
  <text class="t" x="283.5" y="238" text-anchor="middle">preparation</text>
  <line class="flow" x1="283.5" y1="182" x2="283.5" y2="194" marker-end="url(#a1)"/>

  <!-- Payments -->
  <rect class="box" x="413" y="196" width="151" height="62" rx="4"/>
  <text class="t" x="488.5" y="216" text-anchor="middle">Payment rules</text>
  <text class="s" x="488.5" y="234" text-anchor="middle">transfer type flags</text>
  <text class="s" x="488.5" y="248" text-anchor="middle">base currency amounts</text>

  <!-- Detection -->
  <rect class="box" x="618" y="120" width="151" height="62" rx="4"/>
  <text class="t" x="693.5" y="146" text-anchor="middle">Rules engine</text>
  <text class="s" x="693.5" y="164" text-anchor="middle">explainable account rules</text>
  <rect class="box" x="618" y="196" width="151" height="62" rx="4"/>
  <text class="t" x="693.5" y="222" text-anchor="middle">Feature pipeline</text>
  <text class="s" x="693.5" y="240" text-anchor="middle">account, velocity, graph</text>
  <rect class="box" x="618" y="272" width="151" height="62" rx="4"/>
  <text class="t" x="693.5" y="298" text-anchor="middle">ML model</text>
  <text class="s" x="693.5" y="316" text-anchor="middle">account risk score</text>
  <line class="flow" x1="693.5" y1="258" x2="693.5" y2="270" marker-end="url(#a1)"/>

  <!-- Ground truth and evaluation -->
  <rect class="box" x="823" y="120" width="151" height="62" rx="4"/>
  <text class="t" x="898.5" y="146" text-anchor="middle">Ground truth</text>
  <text class="s" x="898.5" y="164" text-anchor="middle">account, transaction labels</text>
  <rect class="box" x="823" y="196" width="151" height="138" rx="4"/>
  <text class="t" x="898.5" y="224" text-anchor="middle">Evaluation harness</text>
  <text class="s" x="898.5" y="252" text-anchor="middle">temporal split</text>
  <text class="s" x="898.5" y="270" text-anchor="middle">alert budget metrics</text>
  <text class="s" x="898.5" y="288" text-anchor="middle">cost and thresholds</text>
  <text class="s" x="898.5" y="306" text-anchor="middle">stability and errors</text>
  <line class="flow" x1="845" y1="182" x2="845" y2="194" marker-end="url(#a1)"/>

  <!-- Flows between contexts -->
  <line class="flow" x1="161" y1="151" x2="206" y2="151" marker-end="url(#a1)"/>
  <text class="flow-l" x="181" y="142" text-anchor="middle">files</text>
  <line class="flow" x1="359" y1="227" x2="411" y2="227" marker-end="url(#a1)"/>
  <text class="flow-l" x="385" y="218" text-anchor="middle">uses</text>
  <path class="flow" d="M283.5 258 V303 H604" marker-end="url(#a1)"/>
  <text class="flow-l" x="488.5" y="296" text-anchor="middle">prepared transactions</text>
  <line class="flow" x1="769" y1="265" x2="821" y2="265" marker-end="url(#a1)"/>
  <text class="flow-l" x="795" y="256" text-anchor="middle">scores</text>


  <!-- Legend -->
  <rect class="box none" x="16" y="384" width="26" height="14" rx="3"/>
  <text class="leg" x="50" y="395">Outside the project</text>
  </g>
</svg>
