<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1002 580" role="img" aria-label="Context map of the mule detection system. AMLworld HI-Small files enter the source data context, where data ingestion and validation feed transaction preparation, which uses the payment rules of the payments context. Prepared transactions go to the detection context: the rules engine, the feature pipeline and the ML model. Their scores go to the ground truth and evaluation context, where ground truth, the account and transaction labels, feeds the evaluation harness. The evaluation context sends scoring times to detection, tunes on the validation period only and scores the test period once. No flow goes from ground truth to detection. Source data, detection and evaluation read and write the raw, interim and processed data zones; payments reads and writes none.">
  <style>
    svg { --bg: #ffffff; --fg: #1b2230; --muted: #5a6475; --line: #c4cad5; --accent: #0d6b62; --accent-soft: #e3f1ef; --tag: #e9ecf2; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #1a202a; --fg: #e4e8ef; --muted: #9aa4b5; --line: #3a4352; --accent: #5cc8b8; --accent-soft: #173a36; --tag: #273041; }
    }
    .bg { fill: var(--bg); }
    text { font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; }
    .grp { fill: none; stroke: var(--line); stroke-width: 1; }
    .grp-t { font-size: 13px; font-weight: 600; fill: var(--muted); letter-spacing: 0.06em; }
    .box { fill: var(--bg); stroke: var(--fg); stroke-width: 1.3; }
    .box.has { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
    .box.none { fill: none; stroke: var(--muted); stroke-dasharray: 5 4; }
    .t { font-size: 13px; font-weight: 600; fill: var(--fg); }
    .none-t { fill: var(--muted); }
    .s { font-size: 11px; fill: var(--muted); }
    .pill { fill: var(--tag); }
    .pill-t { font-family: "IBM Plex Mono", Menlo, monospace; font-size: 10px; font-weight: 500; fill: var(--fg); }
    .flow { stroke: var(--fg); stroke-width: 1.4; fill: none; }
    .rw { stroke: var(--muted); stroke-width: 1.2; fill: none; stroke-dasharray: 3 3; }
    .flow-l { font-size: 11px; font-weight: 500; fill: var(--muted); }
    .loop { stroke: var(--accent); stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; }
    .loop-l { font-size: 11px; font-weight: 500; fill: var(--accent); }
    .ah { fill: var(--fg); }
    .ah-acc { fill: var(--accent); }
    .ah-mut { fill: var(--muted); }
    .leg { font-size: 12px; fill: var(--muted); }
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-acc" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-mut" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1002" height="580"/>

  <!-- Scoring times and tuning, from evaluation to detection -->
  <path class="loop" d="M898.5 60 V40 H693.5 V58" marker-end="url(#a2)"/>
  <text class="loop-l" x="796" y="32" text-anchor="middle">scoring times; tuning on validation only; test scored once</text>

  <!-- Context frames -->
  <rect class="grp" x="16" y="60" width="150" height="292" rx="6"/>
  <rect class="grp" x="196" y="60" width="175" height="292" rx="6"/>
  <rect class="grp" x="401" y="60" width="175" height="292" rx="6"/>
  <rect class="grp" x="606" y="60" width="175" height="292" rx="6"/>
  <rect class="grp" x="811" y="60" width="175" height="292" rx="6"/>
  <text class="grp-t" x="91" y="86" text-anchor="middle">EXTERNAL</text>
  <text class="grp-t" x="283.5" y="86" text-anchor="middle">SOURCE DATA</text>
  <text class="grp-t" x="488.5" y="86" text-anchor="middle">PAYMENTS</text>
  <text class="grp-t" x="693.5" y="86" text-anchor="middle">DETECTION</text>
  <text class="grp-t" x="898.5" y="82" text-anchor="middle">GROUND TRUTH</text>
  <text class="grp-t" x="898.5" y="98" text-anchor="middle">AND EVALUATION</text>

  <!-- External -->
  <rect class="box has" x="21" y="120" width="140" height="62" rx="4"/>
  <text class="t" x="91" y="146" text-anchor="middle">AMLworld HI-Small</text>
  <text class="s" x="91" y="164" text-anchor="middle">Kaggle, synthetic</text>
  <rect class="box none" x="21" y="196" width="140" height="62" rx="4"/>
  <text class="t none-t" x="91" y="222" text-anchor="middle">Bank-only data</text>
  <text class="s" x="91" y="240" text-anchor="middle">KYC, devices, reports</text>

  <!-- Source data -->
  <rect class="box has" x="208" y="120" width="151" height="62" rx="4"/>
  <text class="t" x="283.5" y="145" text-anchor="middle">Data ingestion</text>
  <text class="t" x="283.5" y="162" text-anchor="middle">and validation</text>
  <rect class="pill" x="317" y="112" width="28" height="16" rx="3"/><text class="pill-t" x="331" y="124" text-anchor="middle">S1</text>
  <rect class="box" x="208" y="196" width="151" height="62" rx="4"/>
  <text class="t" x="283.5" y="221" text-anchor="middle">Transaction</text>
  <text class="t" x="283.5" y="238" text-anchor="middle">preparation</text>
  <rect class="pill" x="317" y="188" width="28" height="16" rx="3"/><text class="pill-t" x="331" y="200" text-anchor="middle">S2</text>
  <line class="flow" x1="283.5" y1="182" x2="283.5" y2="194" marker-end="url(#a1)"/>

  <!-- Payments -->
  <rect class="box has" x="413" y="196" width="151" height="62" rx="4"/>
  <text class="t" x="488.5" y="222" text-anchor="middle">Payment rules</text>
  <text class="s" x="488.5" y="240" text-anchor="middle">transfer flags, currency</text>
  <rect class="pill" x="522" y="188" width="28" height="16" rx="3"/><text class="pill-t" x="536" y="200" text-anchor="middle">S2</text>

  <!-- Detection -->
  <rect class="box" x="618" y="120" width="151" height="62" rx="4"/>
  <text class="t" x="693.5" y="146" text-anchor="middle">Rules engine</text>
  <text class="s" x="693.5" y="164" text-anchor="middle">explainable account rules</text>
  <rect class="pill" x="727" y="112" width="28" height="16" rx="3"/><text class="pill-t" x="741" y="124" text-anchor="middle">S2</text>
  <rect class="box" x="618" y="196" width="151" height="62" rx="4"/>
  <text class="t" x="693.5" y="222" text-anchor="middle">Feature pipeline</text>
  <text class="s" x="693.5" y="240" text-anchor="middle">account, velocity, graph</text>
  <rect class="pill" x="695" y="188" width="28" height="16" rx="3"/><text class="pill-t" x="709" y="200" text-anchor="middle">S3</text>
  <rect class="pill" x="727" y="188" width="28" height="16" rx="3"/><text class="pill-t" x="741" y="200" text-anchor="middle">S4</text>
  <rect class="box" x="618" y="272" width="151" height="62" rx="4"/>
  <text class="t" x="693.5" y="298" text-anchor="middle">ML model</text>
  <text class="s" x="693.5" y="316" text-anchor="middle">account risk score</text>
  <rect class="pill" x="727" y="264" width="28" height="16" rx="3"/><text class="pill-t" x="741" y="276" text-anchor="middle">S3</text>
  <line class="flow" x1="693.5" y1="258" x2="693.5" y2="270" marker-end="url(#a1)"/>

  <!-- Ground truth and evaluation -->
  <rect class="box has" x="823" y="120" width="151" height="62" rx="4"/>
  <text class="t" x="898.5" y="146" text-anchor="middle">Ground truth</text>
  <text class="s" x="898.5" y="164" text-anchor="middle">account, transaction labels</text>
  <rect class="pill" x="900" y="112" width="28" height="16" rx="3"/><text class="pill-t" x="914" y="124" text-anchor="middle">S1</text>
  <rect class="pill" x="932" y="112" width="28" height="16" rx="3"/><text class="pill-t" x="946" y="124" text-anchor="middle">S2</text>
  <rect class="box" x="823" y="196" width="151" height="138" rx="4"/>
  <text class="t" x="898.5" y="224" text-anchor="middle">Evaluation harness</text>
  <text class="s" x="898.5" y="252" text-anchor="middle">temporal split</text>
  <text class="s" x="898.5" y="270" text-anchor="middle">alert budget metrics</text>
  <text class="s" x="898.5" y="288" text-anchor="middle">cost and thresholds</text>
  <text class="s" x="898.5" y="306" text-anchor="middle">stability and errors</text>
  <rect class="pill" x="868" y="188" width="28" height="16" rx="3"/><text class="pill-t" x="882" y="200" text-anchor="middle">S2</text>
  <rect class="pill" x="900" y="188" width="28" height="16" rx="3"/><text class="pill-t" x="914" y="200" text-anchor="middle">S3</text>
  <rect class="pill" x="932" y="188" width="28" height="16" rx="3"/><text class="pill-t" x="946" y="200" text-anchor="middle">S5</text>
  <line class="flow" x1="845" y1="182" x2="845" y2="194" marker-end="url(#a1)"/>

  <!-- Flows between contexts -->
  <line class="flow" x1="161" y1="151" x2="206" y2="151" marker-end="url(#a1)"/>
  <text class="flow-l" x="181" y="142" text-anchor="middle">files</text>
  <line class="flow" x1="359" y1="227" x2="411" y2="227" marker-end="url(#a1)"/>
  <text class="flow-l" x="385" y="218" text-anchor="middle">uses</text>
  <path class="flow" d="M283.5 258 V303 H604" marker-end="url(#a1)"/>
  <text class="flow-l" x="488.5" y="296" text-anchor="middle">prepared transactions</text>
  <line class="flow" x1="769" y1="265" x2="821" y2="265" marker-end="url(#a1)"/>
  <text class="flow-l" x="795" y="256" text-anchor="middle">scores</text>

  <!-- Data stores band -->
  <rect class="grp" x="196" y="402" width="790" height="110" rx="6"/>
  <text class="grp-t" x="591" y="426" text-anchor="middle">DATA STORES</text>
  <rect class="box has" x="208" y="440" width="151" height="56" rx="4"/>
  <text class="t" x="283.5" y="464" text-anchor="middle">Raw zone</text>
  <text class="s" x="283.5" y="482" text-anchor="middle">as downloaded</text>
  <rect class="pill" x="317" y="432" width="28" height="16" rx="3"/><text class="pill-t" x="331" y="444" text-anchor="middle">S1</text>
  <rect class="box" x="515.5" y="440" width="151" height="56" rx="4"/>
  <text class="t" x="591" y="464" text-anchor="middle">Interim zone</text>
  <text class="s" x="591" y="482" text-anchor="middle">prepared transactions</text>
  <rect class="pill" x="624.5" y="432" width="28" height="16" rx="3"/><text class="pill-t" x="638.5" y="444" text-anchor="middle">S2</text>
  <rect class="box has" x="823" y="440" width="151" height="56" rx="4"/>
  <text class="t" x="898.5" y="464" text-anchor="middle">Processed zone</text>
  <text class="s" x="898.5" y="482" text-anchor="middle">labels, split, scores</text>
  <rect class="pill" x="900" y="432" width="28" height="16" rx="3"/><text class="pill-t" x="914" y="444" text-anchor="middle">S1</text>
  <rect class="pill" x="932" y="432" width="28" height="16" rx="3"/><text class="pill-t" x="946" y="444" text-anchor="middle">S2</text>

  <!-- Read and write links -->
  <line class="rw" x1="240" y1="352" x2="240" y2="400" marker-start="url(#a3)" marker-end="url(#a3)"/>
  <line class="rw" x1="693.5" y1="352" x2="693.5" y2="400" marker-start="url(#a3)" marker-end="url(#a3)"/>
  <line class="rw" x1="898.5" y1="352" x2="898.5" y2="400" marker-start="url(#a3)" marker-end="url(#a3)"/>
  <text class="flow-l" x="702.5" y="380">reads and writes</text>

  <!-- Legend -->
  <rect class="box has" x="16" y="544" width="26" height="14" rx="3"/>
  <text class="leg" x="50" y="555">Built so far</text>
  <rect class="box" x="170" y="544" width="26" height="14" rx="3"/>
  <text class="leg" x="204" y="555">Planned</text>
  <rect class="box none" x="300" y="544" width="26" height="14" rx="3"/>
  <text class="leg" x="334" y="555">Outside the project</text>
  <rect class="pill" x="490" y="543" width="28" height="16" rx="3"/><text class="pill-t" x="504" y="555" text-anchor="middle">S2</text>
  <text class="leg" x="526" y="555">Project stage that builds it</text>
</svg>
