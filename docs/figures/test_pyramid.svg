<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 942 490" role="img" aria-label="Test pyramid for the mule detection system. From the base up: unit tests at code level on hand-built frames, covering functional rules and leakage with property-based tests; component tests on fixture tables, covering functional behaviour, leakage and later ML model tests; integration tests at container level on a fixture dataset, covering schemas at zone boundaries and reading and writing the data zones; and end-to-end tests at context level on a fixture dataset, covering a whole-pipeline run and later ML infrastructure tests. Static analysis sits beneath the pyramid and runs first. Lower levels have more, faster tests; higher levels fewer, slower ones.">
  <style>
    svg { --bg: #ffffff; --fg: #1b2230; --muted: #5a6475; --line: #c4cad5; --accent: #0d6b62; --accent-soft: #e3f1ef; --tag: #e9ecf2; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #1a202a; --fg: #e4e8ef; --muted: #9aa4b5; --line: #3a4352; --accent: #5cc8b8; --accent-soft: #173a36; --tag: #273041; }
    }
    .bg { fill: var(--bg); }
    text { font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; }
    .grp-t { font-size: 13px; font-weight: 600; fill: var(--muted); letter-spacing: 0.06em; }
    .row { stroke: var(--line); stroke-width: 1; }
    .tier { fill: var(--bg); stroke: var(--fg); stroke-width: 1.3; }
    .tier.has { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
    .box { fill: var(--bg); stroke: var(--fg); stroke-width: 1.3; }
    .box.has { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
    .t { font-size: 13px; font-weight: 600; fill: var(--fg); }
    .c4 { font-size: 13px; font-weight: 600; fill: var(--muted); }
    .s { font-size: 11px; fill: var(--muted); }
    .d { font-size: 12px; fill: var(--fg); }
    .pill { fill: var(--tag); }
    .pill-t { font-family: "IBM Plex Mono", Menlo, monospace; font-size: 10px; font-weight: 500; fill: var(--fg); }
    .axis { stroke: var(--muted); stroke-width: 1.2; fill: none; }
    .ah { fill: var(--muted); }
    .leg { font-size: 12px; fill: var(--muted); }
  </style>
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="942" height="490"/>

  <!-- Column headers -->
  <text class="grp-t" x="60" y="40" text-anchor="middle">C4 LEVEL</text>
  <text class="grp-t" x="340" y="40" text-anchor="middle">TEST LEVEL</text>
  <text class="grp-t" x="660" y="40" text-anchor="middle">TEST TYPES</text>
  <text class="grp-t" x="858" y="40" text-anchor="middle">TEST DATA</text>

  <!-- Row separators for the right-hand columns -->
  <line class="row" x1="560" y1="130" x2="926" y2="130"/>
  <line class="row" x1="560" y1="200" x2="926" y2="200"/>
  <line class="row" x1="560" y1="270" x2="926" y2="270"/>

  <!-- C4 levels -->
  <text class="c4" x="60" y="99" text-anchor="middle">Context</text>
  <text class="c4" x="60" y="169" text-anchor="middle">Container</text>
  <text class="c4" x="60" y="239" text-anchor="middle">Component</text>
  <text class="c4" x="60" y="309" text-anchor="middle">Code</text>

  <!-- Speed and volume axis -->
  <line class="axis" x1="128" y1="330" x2="128" y2="70" marker-start="url(#a3)" marker-end="url(#a3)"/>
  <text class="s" x="120" y="74" text-anchor="end">fewer, slower</text>
  <text class="s" x="120" y="334" text-anchor="end">more, faster</text>

  <!-- Pyramid tiers, top to bottom -->
  <polygon class="tier" points="300,60 380,60 417.5,130 262.5,130"/>
  <text class="t" x="340" y="92" text-anchor="middle">End-to-end</text>
  <text class="s" x="340" y="110" text-anchor="middle">pending</text>

  <polygon class="tier" points="262.5,130 417.5,130 455,200 225,200"/>
  <text class="t" x="340" y="162" text-anchor="middle">Integration</text>
  <rect class="pill" x="326" y="171" width="28" height="16" rx="3"/><text class="pill-t" x="340" y="183" text-anchor="middle">S2</text>

  <polygon class="tier" points="225,200 455,200 492.5,270 187.5,270"/>
  <text class="t" x="340" y="232" text-anchor="middle">Component</text>
  <rect class="pill" x="326" y="241" width="28" height="16" rx="3"/><text class="pill-t" x="340" y="253" text-anchor="middle">S2</text>

  <polygon class="tier has" points="187.5,270 492.5,270 530,340 150,340"/>
  <text class="t" x="340" y="302" text-anchor="middle">Unit</text>
  <rect class="pill" x="326" y="311" width="28" height="16" rx="3"/><text class="pill-t" x="340" y="323" text-anchor="middle">S1</text>

  <!-- Foundation: static analysis -->
  <rect class="box has" x="150" y="352" width="380" height="40" rx="4"/>
  <text class="t" x="340" y="369" text-anchor="middle">Static analysis</text>
  <text class="s" x="340" y="385" text-anchor="middle">format, lint and types, run before any test</text>

  <!-- Test types -->
  <text class="d" x="572" y="91">Whole-pipeline run</text>
  <text class="s" x="572" y="109">ML infrastructure (S3)</text>
  <text class="d" x="572" y="161">Schemas at zone boundaries (S2)</text>
  <text class="s" x="572" y="179">reading and writing the data zones</text>
  <text class="d" x="572" y="231">Functional, per component</text>
  <text class="s" x="572" y="249">leakage (S2), ML model (S3)</text>
  <text class="d" x="572" y="301">Functional, per rule (S1)</text>
  <text class="s" x="572" y="319">leakage, property-based (S2)</text>

  <!-- Test data -->
  <text class="d" x="802" y="99">Fixture dataset</text>
  <text class="d" x="802" y="169">Fixture dataset</text>
  <text class="d" x="802" y="239">Fixture tables</text>
  <text class="d" x="802" y="309">Hand-built frames</text>

  <!-- Downloaded data note -->
  <text class="s" x="572" y="369">Downloaded data: raw-file validation, and tests</text>
  <text class="s" x="572" y="385">marked data</text>

  <!-- Legend -->
  <rect class="box has" x="16" y="456" width="26" height="14" rx="3"/>
  <text class="leg" x="50" y="467">Built so far</text>
  <rect class="box" x="170" y="456" width="26" height="14" rx="3"/>
  <text class="leg" x="204" y="467">Planned</text>
  <rect class="pill" x="300" y="455" width="28" height="16" rx="3"/><text class="pill-t" x="314" y="467" text-anchor="middle">S2</text>
  <text class="leg" x="336" y="467">Project stage that starts it</text>
</svg>
