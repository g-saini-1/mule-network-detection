[project]
name = "mule-detection"
version = "0.1.0"
description = "Money mule account detection on synthetic AML data (self-directed learning project)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kaggle",
    "matplotlib",
    "numpy",
    "pandas",
    "pyyaml",
]

[dependency-groups]
dev = [
    "ipykernel",
    "nbconvert>=7.17.2",
    "nbstripout>=0.9.1",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mule_detection"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
