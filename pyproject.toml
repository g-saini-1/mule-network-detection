[project]
name = "mule-detection"
version = "0.1.0"
description = "Money mule account detection on synthetic AML data (self-directed learning project)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "kaggle",
    "matplotlib",
    "numpy",
    "pandas",
    "pyarrow>=26.0.0",
    "pyyaml",
]

[dependency-groups]
dev = [
    "ipykernel",
    "mypy>=2.4.0",
    "nbconvert>=7.17.2",
    "nbstripout>=0.9.1",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4.7.0",
    "pytest",
    "ruff",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mule_detection"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["data: needs the downloaded HI-Small files in data/raw (skipped in CI)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "PD", "NPY", "PTH", "RUF", "D", "ANN"]
# An explicit `Any` is allowed where a third-party library is untyped (e.g. the Kaggle client).
ignore = ["ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["kaggle.*"]
ignore_missing_imports = true
